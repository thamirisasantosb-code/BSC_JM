<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Dashboard – JM Distribuição</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #060f2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated background */
        .bg-layer {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(37,99,235,.18) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(124,58,237,.14) 0%, transparent 55%),
                radial-gradient(ellipse at 60% 80%, rgba(10,36,106,.5) 0%, transparent 60%),
                linear-gradient(160deg, #060f2e 0%, #0c1a4a 50%, #0a1535 100%);
        }

        /* Grid lines pattern */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #2563EB, transparent);
            top: -10%; left: -10%;
            animation-duration: 9s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #7C3AED, transparent);
            bottom: -5%; right: -5%;
            animation-duration: 11s;
            animation-delay: -3s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(30px, -20px) scale(1.05); }
            66%  { transform: translate(-15px, 15px) scale(.97); }
        }

        /* Card */
        .login-card {
            position: relative;
            width: min(420px, 94vw);
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 20px;
            padding: 40px 36px 36px;
            backdrop-filter: blur(20px) saturate(1.4);
            box-shadow:
                0 25px 50px rgba(0,0,0,.5),
                0 0 0 1px rgba(255,255,255,.05) inset;
            animation: cardIn .55s cubic-bezier(.34,1.56,.64,1) forwards;
            opacity: 0;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(.96); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* Logo */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: linear-gradient(135deg, #0A246A, #1a3a8a);
            border: 1.5px solid rgba(255,255,255,.15);
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 0 8px 24px rgba(10,36,106,.5);
            margin-bottom: 14px;
        }

        .logo-jm {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .logo-td {
            background: #E8A838;
            color: #0A246A;
            font-size: 11px;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 6px;
            letter-spacing: .5px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -.3px;
        }

        .logo-subtitle {
            font-size: 12.5px;
            color: rgba(255,255,255,.45);
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: .3px;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: rgba(255,255,255,.08);
            margin: 0 -36px 26px;
        }

        /* Form title */
        .form-title {
            font-size: 15px;
            font-weight: 700;
            color: rgba(255,255,255,.85);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Input groups */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: rgba(255,255,255,.55);
            text-transform: uppercase;
            letter-spacing: .7px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: .5;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 11px 12px 11px 38px;
            background: rgba(255,255,255,.07);
            border: 1.5px solid rgba(255,255,255,.12);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            outline: none;
            transition: all .2s ease;
        }

        .input-group input::placeholder { color: rgba(255,255,255,.3); }

        .input-group input:focus {
            border-color: rgba(99,102,241,.7);
            background: rgba(99,102,241,.08);
            box-shadow: 0 0 0 3px rgba(99,102,241,.18);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: #fff;
            letter-spacing: .2px;
            transition: all .2s ease;
            box-shadow: 0 4px 16px rgba(37,99,235,.4);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            opacity: 0;
            transition: opacity .2s;
        }

        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,.5); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            width: 100%;
            padding: 11px;
            border: 1.5px solid rgba(255,255,255,.14);
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            background: rgba(255,255,255,.04);
            color: rgba(255,255,255,.6);
            transition: all .2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,.08);
            color: rgba(255,255,255,.9);
            border-color: rgba(255,255,255,.22);
        }

        /* Message */
        .message {
            font-size: 12.5px;
            font-weight: 500;
            padding: 9px 12px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(220,38,38,.15);
            border: 1px solid rgba(220,38,38,.3);
            color: #FCA5A5;
            display: block;
        }

        .message.success {
            background: rgba(22,163,74,.15);
            border: 1px solid rgba(22,163,74,.3);
            color: #86EFAC;
            display: block;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        .card-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,.22);
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-badge">
                <span class="logo-jm">JM</span>
                <span class="logo-td">TD</span>
            </div>
            <div class="logo-title">BSC Dashboard</div>
            <div class="logo-subtitle">JM Distribuição · Painel de Controle</div>
        </div>

        <div class="divider"></div>

        <div class="form-title" id="form-title">Acesso ao Painel</div>

        <div class="input-group">
            <label>E-mail corporativo</label>
            <div class="input-wrapper">
                <span class="input-icon">✉️</span>
                <input type="email" id="email" placeholder="seu@jmdistribuicao.com.br"
                       onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
        </div>

        <div class="input-group">
            <label>Senha</label>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" placeholder="••••••••"
                       onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
        </div>

        <div id="msg" class="message"></div>

        <button class="btn-primary" id="btn-submit" onclick="handleLogin()">
            Entrar
        </button>
        <button class="btn-secondary" id="btn-toggle" onclick="toggleForm()">
            Criar Conta
        </button>

        <div class="card-footer">BSC · JM Distribuição &copy; 2026</div>
    </div>

    <script>
        let isLogin = true;

        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById('form-title').textContent  = isLogin ? 'Acesso ao Painel' : 'Criar Nova Conta';
            document.getElementById('btn-submit').textContent  = isLogin ? 'Entrar'           : 'Cadastrar';
            document.getElementById('btn-toggle').textContent  = isLogin ? 'Criar Conta'      : 'Já tenho conta';
            const msg = document.getElementById('msg');
            msg.textContent = '';
            msg.className = 'message';
        }

        async function handleLogin() {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msgEl    = document.getElementById('msg');
            const btn      = document.getElementById('btn-submit');

            if (!email || !password) {
                msgEl.textContent = 'Preencha todos os campos.';
                msgEl.className   = 'message error';
                return;
            }

            btn.innerHTML  = '<span class="spinner"></span>Aguarde...';
            btn.disabled   = true;
            msgEl.className = 'message';

            try {
                const endpoint = isLogin ? '/api/login' : '/api/register';
                const res  = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    if (isLogin) {
                        localStorage.setItem('bsc_user_role',  data.role);
                        localStorage.setItem('bsc_user_email', data.email);
                        msgEl.textContent = '✓ Bem-vindo(a)! Redirecionando...';
                        msgEl.className   = 'message success';
                        setTimeout(() => { window.location.href = 'index.html'; }, 700);
                    } else {
                        msgEl.textContent = data.message;
                        msgEl.className   = 'message success';
                        setTimeout(() => toggleForm(), 2000);
                        btn.innerHTML = 'Cadastrar';
                        btn.disabled  = false;
                    }
                } else {
                    msgEl.textContent = data.error || 'Credenciais inválidas.';
                    msgEl.className   = 'message error';
                    btn.innerHTML = isLogin ? 'Entrar' : 'Cadastrar';
                    btn.disabled  = false;
                }
            } catch (err) {
                msgEl.textContent = 'Erro ao conectar ao servidor. Verifique se o painel está iniciado.';
                msgEl.className   = 'message error';
                btn.innerHTML = isLogin ? 'Entrar' : 'Cadastrar';
                btn.disabled  = false;
            }
        }
    </script>
</body>
</html>
